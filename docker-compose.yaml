name: auction-account

services:
  account-grpc-dev:
    profiles: ["dev"]
    container_name: account-grpc-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    command: air -c .air-grpc.toml
    depends_on:
      account-postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - account-go-mod:/go/pkg/mod
    ports:
      - "9090:${GRPC_PORT:-9090}"
    restart: unless-stopped
    networks:
      - account-internal
      - rabbitmq-shared

  account-grpc:
    profiles: ["prod"]
    container_name: account-grpc
    build:
      context: .
      dockerfile: Dockerfile
      target: grpc
    env_file:
      - .env
    depends_on:
      account-postgres:
        condition: service_healthy
    ports:
      - "9090:${GRPC_PORT:-9090}"
    restart: unless-stopped
    networks:
      - account-internal
      - rabbitmq-shared

  account-worker-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    deploy:
      replicas: 1
    command: air -c .air-worker.toml
    depends_on:
      account-postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - account-go-mod:/go/pkg/mod
    restart: unless-stopped
    networks:
      - account-internal
      - rabbitmq-shared

  account-worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    deploy:
      replicas: 1
    depends_on:
      account-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - account-internal
      - rabbitmq-shared

  account-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account
    volumes:
      - account-postgres-data:/var/lib/postgresql
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - account-internal

volumes:
  account-postgres-data:
  account-go-mod:

networks:
  account-internal:
  rabbitmq-shared:
    external: true
    name: auction-rabbitmq-network
  traefik-shared:
    external: true
    name: auction-traefik-network
